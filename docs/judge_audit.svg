<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 450" width="100%" height="100%" style="background:#EEF1F4; font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;">
  <rect width="800" height="450" fill="#EEF1F4" />
  <rect x="30" y="30" width="740" height="390" rx="12" fill="#FFFFFF" stroke="#C9D0DB" stroke-width="1.5" />

  <text x="60" y="70" font-size="18" font-weight="700" fill="#101B33">Judge Model Audit &amp; Reliability Diagnostic</text>
  <text x="60" y="92" font-size="12" fill="#5A6679">Measuring consistency, length bias, and order symmetry of Gemma 4</text>

  <rect x="60" y="120" width="200" height="110" rx="8" fill="#F8FAFC" stroke="#E2E8F0" stroke-width="1.5" />
  <text x="80" y="150" font-size="12" font-weight="600" fill="#64748B">TRUST SCORE</text>
  <text x="80" y="195" font-size="38" font-weight="800" fill="#1F7A5A">88<tspan font-size="18" font-weight="500" fill="#64748B">/100</tspan></text>
  <text x="80" y="218" font-size="11" font-weight="600" fill="#1F7A5A">High Confidence Verdict</text>

  <rect x="280" y="120" width="220" height="110" rx="8" fill="#F8FAFC" stroke="#E2E8F0" stroke-width="1.5" />
  <text x="300" y="150" font-size="12" font-weight="600" fill="#64748B">RETEST CONSISTENCY</text>
  <text x="300" y="190" font-size="28" font-weight="700" fill="#101B33">0.93</text>
  <text x="300" y="215" font-size="11" fill="#64748B">Spearman ρ across duplicate passes</text>

  <rect x="520" y="120" width="210" height="110" rx="8" fill="#F8FAFC" stroke="#E2E8F0" stroke-width="1.5" />
  <text x="540" y="150" font-size="12" font-weight="600" fill="#64748B">LENGTH BIAS (r)</text>
  <text x="540" y="190" font-size="28" font-weight="700" fill="#101B33">+0.04</text>
  <text x="540" y="215" font-size="11" fill="#1F7A5A">Neutral (no verbosity penalty)</text>

  <rect x="60" y="250" width="670" height="145" rx="8" fill="#F8FAFC" stroke="#E2E8F0" stroke-width="1.5" />
  <text x="80" y="280" font-size="13" font-weight="700" fill="#101B33">Pairwise Order Symmetry Diagnostic</text>
  <text x="80" y="300" font-size="11" fill="#64748B">Tests if candidate position (Model A vs Model B) alters the judge's preference</text>

  <rect x="80" y="318" width="630" height="24" rx="4" fill="#E2E8F0" />
  <rect x="80" y="318" width="560" height="24" rx="4" fill="#2748F5" />
  <text x="90" y="335" font-size="11" font-weight="700" fill="#FFFFFF">89% Consistent Decisions (Position Swapped)</text>

  <text x="80" y="365" font-size="11" fill="#64748B">Total Comparisons: 24 pairs | Position Flips: 2 | Ties: 3</text>
</svg>
